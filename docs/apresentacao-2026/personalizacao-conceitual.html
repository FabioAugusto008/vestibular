<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Fluxo proposto de personalização com IA</title><style>html,body{margin:0;background:#f6f8fc;font-family:'Segoe UI',Arial,sans-serif}svg{display:block}</style><svg id="conceptual-flow" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#547a96"/></marker></defs><rect width="1920" height="1080" fill="#f6f8fc"/><text x="80" y="95" font-size="25" font-weight="650" fill="#176d76">ESTUDAI | DIAGRAMA EXPLICATIVO PARA OS SLIDES</text><text x="80" y="165" font-size="50" font-weight="700" fill="#092b57">Fluxo proposto de personalização com IA</text><text x="80" y="211" font-size="27" fill="#54667b">Informações declaradas pelo estudante orientam a proposta; a integração remota ainda está em validação.</text><rect x="80" y="265" width="500" height="445" rx="22" fill="white" stroke="#c8d8e8" stroke-width="2"/><rect x="710" y="265" width="500" height="445" rx="22" fill="#eef6f5" stroke="#87b9b0" stroke-width="2"/><rect x="1340" y="265" width="500" height="445" rx="22" fill="white" stroke="#c8d8e8" stroke-width="2"/><text x="114" y="315" font-size="22" fill="#55809c">01 | ENTRADAS</text><text x="114" y="366" font-size="34" font-weight="700" fill="#092b57">Dados do estudante</text><g font-size="29" fill="#324b63"><text x="114" y="431">Objetivo educacional</text><text x="114" y="484">Dificuldades informadas</text><text x="114" y="537">Matérias e conteúdos</text><text x="114" y="590">Dias e horários disponíveis</text><text x="114" y="643">Preferências e reforços</text></g><path d="M609 490 H677" stroke="#547a96" stroke-width="5" marker-end="url(#arrow)"/><text x="744" y="315" font-size="22" fill="#27776a">02 | PROCESSAMENTO PROPOSTO</text><text x="744" y="366" font-size="32" font-weight="700" fill="#092b57">Apoio com IA</text><g font-size="28" fill="#324b63"><text x="744" y="431">Análise das necessidades</text><text x="744" y="491">Identificação de prioridades</text><text x="744" y="551">Proposta de distribuição</text><text x="744" y="590">dos estudos</text></g><rect x="744" y="637" width="390" height="43" rx="21" fill="#d4eae3"/><text x="766" y="667" font-size="23" font-weight="650" fill="#176859">Em desenvolvimento / validação</text><path d="M1239 490 H1307" stroke="#547a96" stroke-width="5" marker-end="url(#arrow)"/><text x="1374" y="315" font-size="22" fill="#55809c">03 | RESULTADO ESPERADO</text><text x="1374" y="366" font-size="32" font-weight="700" fill="#092b57">Planejamento</text><text x="1374" y="407" font-size="32" font-weight="700" fill="#092b57">personalizado</text><g font-size="29" fill="#324b63"><text x="1374" y="479">Matérias e conteúdos</text><text x="1374" y="538">Dias, horários e duração</text><text x="1374" y="597">Atividades de estudo</text><text x="1374" y="656">Tarefas e calendário</text></g><rect x="80" y="758" width="1760" height="205" rx="20" fill="#092b57"/><text x="114" y="810" font-size="30" font-weight="700" fill="white">O que funciona na demonstração atual</text><text x="114" y="861" font-size="29" fill="#e4eef6">Gerador por regras locais (FALLBACK) → plano salvo → tarefas e calendário.</text><text x="114" y="912" font-size="26" fill="#c7d9e9">A IA remota permanece desativada. Nenhuma resposta da OpenRouter é simulada neste diagrama.</text><text x="80" y="1021" font-size="24" fill="#54667b">Representação conceitual separada da aplicação. Não é captura de uma geração remota aprovada.</text></svg></html>
