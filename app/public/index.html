<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EstudAI - Login</title>
<meta name="description" content="EstudAI e uma plataforma inteligente para organizacao, planejamento e acompanhamento da rotina de estudos.">
<meta name="theme-color" content="#092b57">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../src/assets/brand/favicon.ico" sizes="any">
<link rel="icon" href="../src/assets/icons/estudai-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../src/assets/brand/estudai-mark-light.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../src/styles/design-system.css">
<link rel="stylesheet" href="../src/styles/login.css">

</head>
<body>

<div class="bg-gradient"></div>
<div class="bg-grid"></div>

<div class="page">
  <div class="brand">
    <div class="brand-logo-frame" aria-label="EstudAI">
      <img class="brand-logo-img" src="../src/assets/visual-identity/.png/Deitada%20modo%20claro%20sem%20fundo.png" alt="EstudAI">
    </div>
    <p>Organizacao inteligente para sua rotina de estudos</p>
  </div>

  <div class="card">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">Entrar</button>
      <button class="tab" onclick="switchTab('cadastro')">Criar conta</button>
    </div>

    <!-- LOGIN -->
    <div id="form-login">
      <div id="alert-login" class="alert" aria-live="polite"></div>
      <div class="form-group">
        <label for="login-email">E-mail</label>
        <input type="email" id="login-email" placeholder="seu@email.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label for="login-senha">Senha</label>
        <input type="password" id="login-senha" placeholder="Digite sua senha" autocomplete="current-password">
      </div>
      <button class="btn" id="btn-login" type="button" onclick="fazerLogin()">Entrar</button>
    </div>

    <!-- CADASTRO -->
    <div id="form-cadastro" class="hidden">
      <div id="alert-cadastro" class="alert" aria-live="polite"></div>
      <div class="form-group">
        <label for="cad-nome">Nome completo</label>
        <input type="text" id="cad-nome" placeholder="Como devemos te chamar?">
      </div>
      <div class="form-group">
        <label for="cad-email">E-mail</label>
        <input type="email" id="cad-email" placeholder="seu@email.com">
      </div>
      <div class="form-group">
        <label for="cad-senha">Senha</label>
        <input type="password" id="cad-senha" placeholder="Minimo 6 caracteres" autocomplete="new-password">
      </div>
      <button class="btn" id="btn-cadastro" type="button" onclick="fazerCadastro()">Criar minha conta</button>
    </div>
  </div>

  <div class="features">
    <div class="feature">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      Planeje sua rotina
    </div>
    <div class="feature">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
      </svg>
      Acompanhe progresso
    </div>
    <div class="feature">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 18.657A8 8 0 016.343 7.343S7 9 9 10c0-2 .5-5 2.986-7C14 5 16.09 5.777 17.656 7.343A7.975 7.975 0 0120 13a7.975 7.975 0 01-2.343 5.657z" />
      </svg>
      Planeje com apoio de IA
    </div>
  </div>

  <div class="footer">
    O EstudAI usa IA para analisar sua rotina e montar seu calendario de estudos. Os exercicios vêm de uma base propria organizada por materia, conteudo e dificuldade.
  </div>
</div>

<script src="../src/config/api.js"></script>
<script src="../src/services/http.js"></script>
<script src="../src/services/pwa.js"></script>
<script src="../src/pages/login.js"></script>
</body>
</html>
